    {"@type":"Question","name":"What is the difference between Agile and Scaled Agile?","acceptedAnswer":{"@type":"Answer","text":"Agile describes how a single small team works iteratively. Scaled Agile applies those same principles across many teams building one product, adding the roles, cadence, and planning events needed to keep everyone aligned. SAFe is the most widely used scaling framework."}},
    {"@type":"Question","name":"What does SAFe stand for?","acceptedAnswer":{"@type":"Answer","text":"SAFe is the Scaled Agile Framework — a knowledge base of proven patterns for applying Lean and Agile practices at enterprise scale."}},
    {"@type":"Question","name":"What is an Agile Release Train?","acceptedAnswer":{"@type":"Answer","text":"An Agile Release Train (ART) is a team of 5 to 12 Agile teams — usually 50 to 125 people — that plans, commits, and delivers value together on a shared cadence called a Program Increment."}},
    {"@type":"Question","name":"What is PI Planning?","acceptedAnswer":{"@type":"Answer","text":"PI Planning is a cadence-based event where the entire Agile Release Train comes together for one to two days to plan the next Program Increment — aligning on objectives, surfacing dependencies, and committing as one team of teams."}},
    {"@type":"Question","name":"What does a Release Train Engineer do?","acceptedAnswer":{"@type":"Answer","text":"The Release Train Engineer (RTE) is a servant leader who facilitates the ART's events, manages cross-team risks and dependencies, and keeps value flowing. They are often described as the chief Scrum Master of the train."}},
    {"@type":"Question","name":"Do I need to be technical to work in Scaled Agile?","acceptedAnswer":{"@type":"Answer","text":"No. Scaled Agile includes technical and non-technical roles. Facilitation, coaching, product, and leadership roles like Scrum Master, Product Owner, and RTE focus on collaboration and flow rather than writing code."}},
    {"@type":"Question","name":"How do I start learning Scaled Agile?","acceptedAnswer":{"@type":"Answer","text":"Start with the fundamentals: understand what an ART is, learn the cadence and events, and get comfortable with the core roles and vocabulary."}}
