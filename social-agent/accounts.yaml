# Social media account registry.
# Each account is an isolated "context": its own focus, voice, audience,
# hashtags, topic keywords (used for mix-up detection) and publisher.
#
# Switch the active account with:  python -m socialagent use <id>
#
# publisher options:
#   outbox   - dry run: writes the final post to social-agent/outbox/ (default, safe)
#   linkedin - posts via the LinkedIn REST API (needs env token, see publisher_config)
#   buffer   - queues via the Buffer API
#   webhook  - POSTs the post JSON to a workflow URL (Zapier / Make / n8n)

accounts:
  - id: agile-agilist
    name: Agile Agilist — Company Page
    platform: linkedin
    focus: >
      SAFe training and certification (Leading SAFe, SAFe Scrum Master, ASPC/SPC),
      AI-native agile transformation, enterprise agility for delivery leaders.
    audience: >
      Delivery managers, RTEs, agile coaches, and transformation leads in
      mid-to-large enterprises, primarily North America and UK/EU.
    voice: >
      Authoritative but practical. Speaks from real transformation experience.
      No hype, no buzzword soup. Short paragraphs, concrete takeaways,
      one clear call to action (usually a cohort date or course page).
    hashtags: ["#SAFe", "#LeadingSAFe", "#AgileTransformation", "#ScaledAgile", "#AINative"]
    topics: [safe, leading safe, scaled agile, rte, pi planning, art, spc, aspc,
             scrum master, certification, cohort, agile transformation, ai-native]
    publisher: outbox
    publisher_config: {}

  - id: personal-brand
    name: Founder — Personal LinkedIn
    platform: linkedin
    focus: >
      First-person lessons from building a training business, AI tooling for
      consultants, opinions on where agile and AI-assisted delivery are heading.
    audience: >
      Peers: trainers, consultants, founders of boutique services firms;
      prospective corporate clients who buy from the person, not the brand.
    voice: >
      First person, candid, slightly contrarian. Stories and specifics over
      frameworks. Comfortable admitting mistakes. Soft CTA or none at all.
    hashtags: ["#BuildInPublic", "#Consulting", "#AI", "#Agile"]
    topics: [founder, lessons, story, ai tools, claude, automation, consulting,
             training business, marketing, personal]
    publisher: outbox
    publisher_config: {}

  - id: executive-insights
    name: Executive Insights — Thought Leadership
    platform: linkedin
    focus: >
      Story-driven thought leadership for senior executives navigating AI-era
      transformation: historical business anecdotes (Otellini, Deming, Bezos,
      SAP, Yokoi) turned into contrarian, actionable lessons on strategy,
      leadership, data, and enterprise AI adoption.
    audience: >
      C-suite and senior enterprise leaders (CEOs, CFOs, CMOs, CIOs) making
      transformation and AI strategy decisions; consultants advising them.
    voice: >
      Authoritative, story-first, lightly contrarian. Opens with a dated,
      documented moment; builds in one-sentence paragraphs; pivots to what
      executives face right now; closes grounded and forward-looking.
      Verified facts and numbers over adjectives. No emoji, no hype.
    hashtags: ["#Leadership", "#Innovation", "#StrategicPlanning", "#Transformation", "#AI"]
    topics: [executive, leadership, ceo, boardroom, strategy, transformation,
             enterprise, innovation, paradigm shift, deming, spreadsheet,
             data-driven, decision-making, ai adoption, thought leadership]
    publisher: outbox
    publisher_config: {}

