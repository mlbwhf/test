<text x="620" y="62" text-anchor="middle" font-size="13" fill="#5a6b7c">The Innovation Playground, Chapter 6 · v1.0 · CC BY-SA 4.0</text>
<text x="620" y="90" text-anchor="middle" font-size="13" font-weight="bold" fill="#3a4a5a" letter-spacing="2">PATTERNS — HOW MUCH CHANGES, AND HOW THE MARKET REACTS →</text>
