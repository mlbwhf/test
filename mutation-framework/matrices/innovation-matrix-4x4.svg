<text x="512.5" y="110" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a2a3a">Architectural</text>
<text x="727.5" y="110" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a2a3a">Radical</text>
<text x="942.5" y="110" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a2a3a">Disruptive</text>
