<script type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"Article","headline":"State of AI Tokens 2026","description":"What a million AI tokens cost, how many tokens the largest platforms process, and what is earned and returned per token, 2024 to 2026 to date.","url":"https://report-ai.org/indexes/state-of-ai/state-of-ai-tokens/","mainEntityOfPage":"https://report-ai.org/indexes/state-of-ai/state-of-ai-tokens/","datePublished":"2026-11-11","dateModified":"2026-11-11","author":{"@type":"Organization","name":"Report AI","url":"https://report-ai.org"},"publisher":{"@id":"https://report-ai.org/#organization"},"isPartOf":{"@type":"CreativeWorkSeries","name":"State of AI — Report AI","url":"https://report-ai.org/indexes/state-of-ai/"}},{"@type":"FAQPage","mainEntity":[{"@type":"Question","name":"How many tokens does $1 buy in 2026?","acceptedAnswer":{"@type":"Answer","text":"It depends on the model. At GPT-4 (March 2023) quality, OpenAI's GPT-6 Luna and Anthropic's Claude Haiku 5.5 list at $0.10 per million input tokens and $0.50 per million output tokens as of October 2026, about 5 million tokens per dollar on a 3:1 input:output blend. OpenAI's flagship GPT-6.1 Sol, at $2 and $10, buys about 250,000, and Anthropic's Claude Opus 5.5, at $4 and $20, about 125,000 (Report AI calculations from list prices)."}},{"@type":"Question","name":"Are AI token prices still falling in 2026?","acceptedAnswer":{"@type":"Answer","text":"The average price paid is falling; frontier list prices mostly are not. Silicon Data's usage-weighted LLM Token Expenditure Index fell from about $2.07 per million tokens in late May 2026 to below $1 by 22 October 2026, according to Axios, largely because buyers switched to cheaper models. OpenAI cut GPT-6 Sol by 50% in September 2026, while Google scheduled Gemini 4 Argon's price to double to $4 and $20 on 30 November 2026."}},{"@type":"Question","name":"How many tokens do AI platforms process?","acceptedAnswer":{"@type":"Answer","text":"Each platform uses its own unit. Google reported more than 3.2 quadrillion tokens a month across its products in May 2026, and its model APIs about 32 billion tokens a minute in Q3 2026. ByteDance reported more than 180 trillion tokens a day for its Doubao models in June 2026. OpenRouter routed 790 trillion tokens in October 2026. China's National Data Administration put national use at more than 140 trillion tokens a day in March 2026. OpenAI, Microsoft and Anthropic have not published 2026 totals."}},{"@type":"Question","name":"If tokens are cheaper, why are AI bills rising?","acceptedAnswer":{"@type":"Answer","text":"Each task now uses many more tokens. On OpenRouter the average prompt grew from about 1,500 to 6,000 tokens between November 2024 and November 2025 (a16z / OpenRouter), and reasoning models and agents generate far more output. At OpenAI's flagship list prices, Report AI calculates that the average request cost about $0.0053 in November 2024 and $0.0115 in November 2025, more than double, even though the blended token price fell 21%."}},{"@type":"Question","name":"What is the return per AI token?","acceptedAnswer":{"@type":"Answer","text":"No company or study publishes it. Report AI's proxies: customers spent about $0.71 per million tokens routed through OpenRouter in August 2026, down from about $1.00 in mid-2025 (derived from Sacra and Menlo Ventures figures), and revenue per token is about 95% lower than in 2024 on our index (combined OpenAI and Anthropic run-rate revenue up about 18 times against Google's token volume up about 330 times). On the buyer side, Wharton's October 2026 survey found 80% of enterprise leaders reporting positive AI returns but only 28% strongly positive, and McKinsey's 2026 survey found 37% reporting any EBIT contribution."}}]},{"@type":"Dataset","name":"State of AI Tokens 2026 (data)","description":"What a million AI tokens cost, how many tokens the largest platforms process, and what is earned and returned
