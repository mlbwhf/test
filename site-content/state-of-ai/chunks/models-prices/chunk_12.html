per million output tokens (7 October 2026). Frontier models cost far more: OpenAI's GPT-6 Sol lists at $2 and $10 (22 September 2026), Claude Opus 5.5 at $4 and $20, Claude Fable 5.1 at $10 and $50, and Google's Gemini 4 Argon rises to $4 and $20 after 30 November 2026."}},{"@type":"Question","name":"Has China caught up with the US in AI models?","acceptedAnswer":{"@type":"Answer","text":"Nearly, on capability. Stanford HAI's 2026 AI Index found the top US model led the best Chinese model by 2.7% on the Arena leaderboard in March 2026, down from 9.26% in January 2024. On the Artificial Analysis Intelligence Index on 3 September 2026, Alibaba's Qwen3.8-Max scored 58 against 58.9 for OpenAI's GPT-5.6 Sol. The US still produces more notable models: 50 to China's 30 in 2025 by one Stanford count (59 to 35 by another), up from 40 to 15 in 2024. China's distinctive advantage is open weights; its labs publish them and the leading US labs mostly do not."}},{"@type":"Question","name":"Are open-weight AI models as good as closed ones in 2026?","acceptedAnswer":{"@type":"Answer","text":"Close, but behind, and how far behind depends on the measure. Stanford HAI found the top closed model led the best open model by 3.3% on Arena in March 2026, up from 1.70% in February 2025. Epoch AI estimates open-weight models have lagged the closed frontier by about four months on average since January 2026. On Artificial Analysis's index the gap was about 6 points in September 2026, but 12 points on its stricter version 5 in October, and about 26 points if only models with published weights are counted."}},{"@type":"Question","name":"How much energy does one AI query use in 2026?","acceptedAnswer":{"@type":"Answer","text":"A typical text query uses roughly a third of a watt-hour. A 2026 Microsoft Research study in the journal Joule estimated a median of 0.31 watt-hours per chatbot query, in line with Google's August 2025 figure of 0.24 Wh for a median Gemini text prompt and Sam Altman's June 2025 figure of about 0.34 Wh for ChatGPT. Long reasoning-style responses use far more: about 3.9 Wh in the same study. The older 2.9 Wh per-query figure from 2023–24 is out of date, and no regulator requires companies to disclose these numbers."}}]},{"@type":"Dataset","name":"State of AI Models & Prices 2026 (data)","description":"What frontier AI models can do and what they cost: benchmark scores, the US–China and open–closed gaps, token prices from the cheapest tier to the frontier, training compute and cost, context windows, reasoning milestones and energy per query, each dated and sourced.","url":"https://report-ai.org/indexes/state-of-ai/state-of-ai-models-prices/","creator":{"@type":"Organization","name":"Report AI","url":"https://report-ai.org"},"publisher":{"@id":"https://report-ai.org/#organization"},"isAccessibleForFree":true,"dateModified":"2026-11-11","temporalCoverage":"2024/2026","distribution":[{"@type":"DataDownload","encodingFormat":"text/csv","contentUrl":"https://report-ai.org/wp-content/uploads/2026/11/report-ai-data-state-of-ai-models-prices-2026-rev20261112.csv"}]}]}</script>
