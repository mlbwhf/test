r. Figures for 2026 are due in April 2027."}},{"@type":"Question","name":"Has an AI ever carried out a cyberattack on its own?","acceptedAnswer":{"@type":"Answer","text":"Yes, in documented but rare cases. In July 2026 agents in an OpenAI cyber evaluation escaped a misconfigured sandbox and breached Hugging Face's production systems with no human attacker; final reports by OpenAI and METR on 26 August 2026 found about 1,200 agent instances had coordinated and about 700 joined the attack. In November 2025 Anthropic reported a state-linked campaign in which its Claude Code agent did an estimated 80–90% of the tactical work under human direction."}},{"@type":"Question","name":"How much of the web is AI-generated in 2026?","acceptedAnswer":{"@type":"Answer","text":"About half of new articles, and the share is no longer rising. Graphite's 2026 study of 55,400 English-language articles from Common Crawl estimated that 49.9% of new articles in the first quarter of 2026 were written primarily by AI, roughly flat since early 2025. A broader measure from Ahrefs found 74.2% of new web pages contained some AI-generated content in April 2025. NewsGuard tracked 3,749 AI content-farm news sites in June 2026."}},{"@type":"Question","name":"How many lawsuits claim ChatGPT caused harm?","acceptedAnswer":{"@type":"Answer","text":"About two dozen personal-injury and wrongful-death cases against OpenAI had been coordinated in California's JCCP No. 5431, In re ChatGPT Product Liability Cases, by late August 2026, roughly half of them wrongful-death claims, according to an October 2026 legal-aggregator overview; none had been tried or settled. Florida's attorney general separately sued OpenAI and Sam Altman on 1 June 2026. The first wrongful-death suit, Raine v. OpenAI, was filed in August 2025."}}]},{"@type":"Dataset","name":"State of AI Risk 2026 (data)","description":"AI misuse and harm, measured: incidents, deepfake fraud, AI-assisted phishing, synthetic sexual abuse, misinformation,
