ations phased in from February 2025. In the US, state legislatures introduced 635 AI-related bills in 2024 and enacted 99, according to MultiState; there was no federal AI statute."}},{"@type":"Question","name":"How many jobs did AI cut in 2024?","acceptedAnswer":{"@type":"Answer","text":"Challenger, Gray & Christmas counted 12,742 US job cuts in 2024 that employers attributed to artificial intelligence, about 1.7% of the 761,358 cuts announced that year."}}]},{"@type":"Dataset","name":"State of AI in Numbers 2024 (data)","description":"The figures that defined AI in 2024 across eleven themes, from ChatGPT's 300 million weekly users and $245 billion of big-tech capex to the EU AI Act's entry into force, each sourced, dated and confidence-rated.","url":"https://report-ai.org/indexes/state-of-ai/state-of-ai-2024/","creator":{"@type":"Organization","name":"Report AI","url":"https://report-ai.org"},"publisher":{"@id":"https://report-ai.org/#organization"},"isAccessibleForFree":true,"dateModified":"2026-11-11","temporalCoverage":"2024/2024","distribution":[{"@type":"DataDownload","encodingFormat":"text/csv","contentUrl":"https://report-ai.org/wp-content/uploads/2026/11/report-ai-data-state-of-ai-2024-in-numbers.csv"}]}]}</script>
