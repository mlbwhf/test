<script type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"Article","headline":"State of AI Work 2026","description":"How AI is changing the number, kind and pay of jobs: US job cuts employers attribute to AI, reversals and rehiring, entry-level and graduate hiring, AI job postings, worker AI use, the AI skills wage premium, measured productivity effects and occupational exposure, each figure dated, sourced and confidence-rated.","url":"https://report-ai.org/indexes/state-of-ai/state-of-ai-work/","mainEntityOfPage":"https://report-ai.org/indexes/state-of-ai/state-of-ai-work/","datePublished":"2026-11-11","dateModified":"2026-11-11","author":{"@type":"Organization","name":"Report AI","url":"https://report-ai.org"},"publisher":{"@id":"https://report-ai.org/#organization"},"isPartOf":{"@type":"CreativeWorkSeries","name":"State of AI — Report AI","url":"https://report-ai.org/indexes/state-of-ai/"}},{"@type":"FAQPage","mainEntity":[{"@type":"Question","name":"How many US jobs have been cut because of AI?","acceptedAnswer":{"@type":"Answer","text":"Challenger, Gray & Christmas counted 12,742 US job cuts attributed to AI in 2024, 54,836 in 2025 and 121,401 from January to October 2026, about 193,000 since its tracking began in 2023 by Report AI's sum. These are announced cuts where the employer named AI as the reason; they can overstate AI's role, because AI is a palatable public reason, and understate it, because some cuts are filed under other headings. AI-attributed cuts fell to 1,265 in October 2026, and by 5 November 2026 market and economic conditions had overtaken AI as the leading stated reason for 2026."}},{"@type":"Question","name":"Are companies rehiring workers after AI layoffs?","acceptedAnswer":{"@type":"Answer","text":"Yes, in measurable numbers. Robert Half found in 2026 that 32% of US hiring managers who eliminated a role primarily because of AI later rehired for it, usually in a hybrid role paying 20–35% more. Klarna began rehiring human support agents in 2025 after its CEO said cost had been too predominant a factor, and Meta cancelled the second wave of its 2026 Project OT cuts. Forrester has forecast that about half of AI-attributed layoffs will be reversed in some form by the end of 2026; that forecast resolves in January 2027."}},{"@type":"Question","name":"Is AI reducing entry-level and graduate jobs?","acceptedAnswer":{"@type":"Answer","text":"The evidence points that way for AI-exposed occupations, though causation is not proven. Stanford Digital Economy Lab's August 2026 update, using ADP payroll data through June 2026, found employment of 22-to-25-year-olds in AI-exposed US occupations 19% below where it would have been had it kept pace with less-exposed peers, up from 16% in November 2025. SignalFire reports new-graduate hiring at 12 large tech firms about 65% below 2019 in 2026. Graduate hiring overall is not collapsing: NACE's spring 2026 update projected a 5.6% increase in hiring for the class of 2026."}},{"@type":"Question","name":"How many workers use AI at work, and does it pay?","acceptedAnswer":{"@type":"Answer","text":"Gallup found in May 2026 that 52% of US employees used AI at work at least a few times a year, 30% a few times a week or more and 15% daily, up from about 4% daily in mid-2024. PwC's 2026 Global AI Jobs Barometer, published in June 2026 and based on the previous year's job advertisements across many countries, found that jobs requiring AI skills advertised wages 62% higher on average than comparable roles without them, up from 56% (restated 57%) a year earlier. The premium varies widely by sector, from 118% in consumer markets to 16% in government."}},{"@type":"Question","name":"Does AI actually make workers more productive?","acceptedAnswer":{"@type":"Answer","text":"On specific tasks often, across whole jobs not yet measurably. The St. Louis Fed's survey put time saved by generative AI at about 1.4% of all US work hours in November 2024 and about 2% by early 2026, self-reported. A METR randomised trial published in July 2025 found experienced developers took 19% longer with early-2025 AI tools on codebases they knew. In NBER's February 2026 study of executives in four countries, 89% reported no effect of AI on labour productivity over the previous three years, while expecting a 1.4% gain over the next three."}}]},{"@type":"Dataset","name":"State of AI Work 2026 (data)","description":"How AI is changing the number, kind and pay of jobs: US job cuts employers attribute to AI, reversals and rehiring, entry-level and graduate hiring, AI job postings, worker AI use, the AI skills wage premium, measured productivity effects and occupational exposure, each figure dated, sourced and confidence-rated.","url":"https://report-ai.org/indexes/state-of-ai/state-of-ai-work/","creator":{"@type":"Organization","name":"Report AI","url":"https://report-ai.org"},"publisher":{"@id":"https://report-ai.org/#organization"},"isAccessibleForFree":true,"dateModified":"2026-11-11","temporalCoverage":"2024/2026","distribution":[{"@type":"DataDownload","encodingFormat":"text/csv","contentUrl":"https://report-ai.org/wp-content/uploads/2026/11/report-ai-data-state-of-ai-work-2026.csv"}]}]}</script>
