# Trainyard: production Compose for a single VPS behind an existing Traefik, next to
# EnrollClass (gate) on the same host.
#
#   /opt/trainyard/docker-compose.yml  (this file)
#   /opt/trainyard/.env                (from env.production.example, never committed)
#
# Traefik (Hostinger "Docker and Traefik" template) already owns ports 80/443 and issues
# Let's Encrypt certificates. This project publishes no host ports; Traefik discovers api
# and web through Docker labels. Postgres and the optional local model are reachable only
# inside the project.

name: trainyard

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: trainyard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: trainyard
    command: >-
      postgres -c shared_buffers=256MB -c effective_cache_size=768MB -c work_mem=8MB
      -c wal_compression=on -c log_min_duration_statement=500
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trainyard -d trainyard"]
      interval: 10s
      timeout: 5s
      retries: 12
    deploy:
      resources:
        limits: { memory: 512m }

  api:
    image: ${TRAINYARD_API_IMAGE:-ghcr.io/mlbwhf/trainyard-api:latest}
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    env_file: [.env]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    environment:
      TRAINYARD_ENV: production
      PORT: "4100"
      DATABASE_URL: postgres://trainyard:${POSTGRES_PASSWORD}@postgres:5432/trainyard
      # Allowed browser origins: the canonical web host plus its aliases (aliases redirect, but a cached page may still call)
      # Website sign-ups are POSTed here as JSON (Slack, n8n, a CRM); they are always listed under Users.
      TRAINYARD_SIGNUP_WEBHOOK: ${TRAINYARD_SIGNUP_WEBHOOK:-}
      # Stripe Checkout for the paid plans; empty = payments off
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_TRAINER_MONTHLY: ${STRIPE_PRICE_TRAINER_MONTHLY:-}
      STRIPE_PRICE_TRAINER_YEARLY: ${STRIPE_PRICE_TRAINER_YEARLY:-}
      STRIPE_PRICE_ACADEMY_MONTHLY: ${STRIPE_PRICE_ACADEMY_MONTHLY:-}
      STRIPE_PRICE_ACADEMY_YEARLY: ${STRIPE_PRICE_ACADEMY_YEARLY:-}
      STRIPE_PRICE_INSIGHTS_MONTHLY: ${STRIPE_PRICE_INSIGHTS_MONTHLY:-}
      STRIPE_PRICE_INSIGHTS_YEARLY: ${STRIPE_PRICE_INSIGHTS_YEARLY:-}
      STRIPE_TRIAL_DAYS: ${STRIPE_TRIAL_DAYS:-30}
      STRIPE_PORTAL_CONFIGURATION: ${STRIPE_PORTAL_CONFIGURATION:-}
      # Outbound mail for the trial confirmation and the reminder 7 days before the first charge.
      TRAINYARD_SMTP_URL: ${TRAINYARD_SMTP_URL:-}
      TRAINYARD_MAIL_FROM: ${TRAINYARD_MAIL_FROM:-}
      TRAINYARD_BILLING_FROM: ${TRAINYARD_BILLING_FROM:-}
      TRAINYARD_WEB_URL: https://${TRAINYARD_WEB_HOST:-plan.${TRAINYARD_DOMAIN:?set TRAINYARD_DOMAIN in .env}},https://${TRAINYARD_WEB_ALT:-_none_},https://${TRAINYARD_WEB_ALT2:-_none_},https://${TRAINYARD_WEB_ALT3:-_none_},https://${TRAINYARD_WEB_ALT4:-_none_},https://${TRAINYARD_WEB_MIRROR:-_none_}
      # An older domain that serves class links and boards as itself, for networks whose web filter
      # blocks the main domain as new (TRAINYARD_WEB_MIRROR, with TRAINYARD_API_MIRROR for the API).
      TRAINYARD_WEB_MIRROR_URL: ${TRAINYARD_WEB_MIRROR:+https://${TRAINYARD_WEB_MIRROR}}
      TRAINYARD_DEMO_CLOCK: "0"
    networks: [internal]
    labels:
      traefik.enable: "true"
      traefik.docker.network: trainyard_internal
      # Aliases (TRAINYARD_API_ALT) get their own router and certificate from deploy.sh, which adds
      # them only once their DNS points here; a name that fails validation must not block this one.
      traefik.http.routers.trainyard-api.rule: Host(`${TRAINYARD_API_HOST:-plan-api.${TRAINYARD_DOMAIN}}`)
      traefik.http.routers.trainyard-api.entrypoints: ${TRAEFIK_ENTRYPOINT:-websecure}
      traefik.http.routers.trainyard-api.tls: "true"
      traefik.http.routers.trainyard-api.tls.certresolver: ${TRAEFIK_CERT_RESOLVER:-letsencrypt}
      traefik.http.routers.trainyard-api.middlewares: trainyard-api-headers
      traefik.http.services.trainyard-api.loadbalancer.server.port: "4100"
      traefik.http.middlewares.trainyard-api-headers.headers.stsSeconds: "31536000"
      traefik.http.middlewares.trainyard-api-headers.headers.stsIncludeSubdomains: "true"
      traefik.http.middlewares.trainyard-api-headers.headers.contentTypeNosniff: "true"
      traefik.http.middlewares.trainyard-api-headers.headers.referrerPolicy: strict-origin-when-cross-origin
    deploy:
      resources:
        limits: { memory: 512m }

  web:
    image: ${TRAINYARD_WEB_IMAGE:-ghcr.io/mlbwhf/trainyard-web:latest}
    restart: unless-stopped
    depends_on: [api]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    environment:
      PORT: "3100"
      HOSTNAME: 0.0.0.0
      # Read when a page is served, so the same image works on any domain.
      TRAINYARD_PUBLIC_API_URL: https://${TRAINYARD_API_HOST:-plan-api.${TRAINYARD_DOMAIN}}
      TRAINYARD_PUBLIC_WEB_URL: https://${TRAINYARD_WEB_HOST:-plan.${TRAINYARD_DOMAIN}}
      # Served on the mirror host, pages talk to the mirror API host (both must point at this server).
      TRAINYARD_PUBLIC_WEB_MIRROR: ${TRAINYARD_WEB_MIRROR:-}
      TRAINYARD_PUBLIC_API_MIRROR: ${TRAINYARD_API_MIRROR:-}
      # Search Console and Bing Webmaster Tools ownership tokens (the content of their meta tags).
      TRAINYARD_GOOGLE_VERIFICATION: ${TRAINYARD_GOOGLE_VERIFICATION:-}
      TRAINYARD_SUPPORT_EMAIL: ${TRAINYARD_SUPPORT_EMAIL:-}
      # /book: Google Calendar appointment schedule links per session type (BOOKING_URL for any without one).
      TRAINYARD_BOOKING_URL: ${TRAINYARD_BOOKING_URL:-}
      TRAINYARD_BOOKING_DEMO_URL: ${TRAINYARD_BOOKING_DEMO_URL:-}
      TRAINYARD_BOOKING_SUPPORT_URL: ${TRAINYARD_BOOKING_SUPPORT_URL:-}
      TRAINYARD_BOOKING_BILLING_URL: ${TRAINYARD_BOOKING_BILLING_URL:-}
      TRAINYARD_BING_VERIFICATION: ${TRAINYARD_BING_VERIFICATION:-}
      # Hosts allowed to frame /embed/* (the Jira app, the Azure DevOps extension). Empty: the
      # default Atlassian and Azure DevOps hosts; narrow it to your own sites.
      TRAINYARD_FRAME_ANCESTORS: ${TRAINYARD_FRAME_ANCESTORS:-}
      NODE_ENV: production
    networks: [internal]
    labels:
      traefik.enable: "true"
      traefik.docker.network: trainyard_internal
      traefik.http.routers.trainyard-web.rule: Host(`${TRAINYARD_WEB_HOST:-plan.${TRAINYARD_DOMAIN}}`)
      traefik.http.routers.trainyard-web.entrypoints: ${TRAEFIK_ENTRYPOINT:-websecure}
      traefik.http.routers.trainyard-web.tls: "true"
      traefik.http.routers.trainyard-web.tls.certresolver: ${TRAEFIK_CERT_RESOLVER:-letsencrypt}
      traefik.http.routers.trainyard-web.middlewares: trainyard-web-headers
      # Web aliases (TRAINYARD_WEB_ALT, TRAINYARD_WEB_ALT2, e.g. www.<domain> and the old plan.<domain>)
      # get one router and certificate each from deploy.sh, once their DNS points here, and this
      # 308 to the canonical host so search engines index one site.
      traefik.http.middlewares.trainyard-web-canonical.redirectregex.regex: ^https?://[^/]+/(.*)
      traefik.http.middlewares.trainyard-web-canonical.redirectregex.replacement: https://${TRAINYARD_WEB_HOST:-plan.${TRAINYARD_DOMAIN}}/$${1}
      traefik.http.middlewares.trainyard-web-canonical.redirectregex.permanent: "true"
      traefik.http.services.trainyard-web.loadbalancer.server.port: "3100"
      traefik.http.middlewares.trainyard-web-headers.headers.stsSeconds: "31536000"
      traefik.http.middlewares.trainyard-web-headers.headers.stsIncludeSubdomains: "true"
      traefik.http.middlewares.trainyard-web-headers.headers.contentTypeNosniff: "true"
      traefik.http.middlewares.trainyard-web-headers.headers.frameDeny: "true"
      traefik.http.middlewares.trainyard-web-headers.headers.referrerPolicy: strict-origin-when-cross-origin
    deploy:
      resources:
        limits: { memory: 512m }

  # Free, local AI assistance: Ollama on the same box. Enabled by LLM_PROFILE=llm in .env
  # (deploy.sh adds --profile llm) and TRAINYARD_LLM_URL=http://ollama:11434/v1. Capped in
  # memory and CPU so inference cannot starve gate; deploy.sh refuses to start it when the
  # host lacks the memory. Not recommended beside gate on a KVM2: a 3B model wants ~3 GB
  # and most of the CPU while answering. The model is pulled on first start.
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    profiles: [llm]
    environment:
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    volumes:
      - ollama:/root/.ollama
    networks: [internal]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama serve &
        pid=$$!
        sleep 5
        ollama pull "${TRAINYARD_LLM_MODEL:-qwen2.5:3b}" || true
        wait $$pid
    deploy:
      resources:
        limits:
          memory: ${OLLAMA_MEMORY_LIMIT:-3g}
          cpus: "${OLLAMA_CPUS:-1}"

  # Flowise (visual LLM flows) on the same box at FLOWISE_HOST, e.g. flowise.<domain>. Enabled by
  # setting FLOWISE_HOST in .env once its DNS points here (deploy.sh adds --profile flowise).
  # Its flows, credentials and SQLite database live in the flowise volume; nothing is shared with
  # the Trainyard API or database. Capped at 1 GB so it cannot starve gate or Trainyard.
  flowise:
    image: flowiseai/flowise:${FLOWISE_VERSION:-latest}
    restart: unless-stopped
    profiles: [flowise]
    security_opt: [no-new-privileges:true]
    environment:
      PORT: "3000"
      APP_URL: https://${FLOWISE_HOST:-flowise.${TRAINYARD_DOMAIN}}
      # First sign-in on Flowise 3 creates the owner account in its own screen; these two keep
      # older images (basic auth) closed as well. Both come from .env.
      FLOWISE_USERNAME: ${FLOWISE_USERNAME:-}
      FLOWISE_PASSWORD: ${FLOWISE_PASSWORD:-}
      # Encrypts stored credentials (API keys of the models Flowise calls). Set once, keep it.
      # Compose interpolates this even when the profile is off, so no :? here; deploy.sh refuses the
      # profile without a secret instead.
      FLOWISE_SECRETKEY_OVERWRITE: ${FLOWISE_SECRET:-}
      DATABASE_TYPE: sqlite
      DATABASE_PATH: /root/.flowise
      APIKEY_PATH: /root/.flowise
      SECRETKEY_PATH: /root/.flowise
      LOG_PATH: /root/.flowise/logs
      BLOB_STORAGE_PATH: /root/.flowise/storage
      DISABLE_FLOWISE_TELEMETRY: "true"
      CORS_ORIGINS: ${FLOWISE_CORS_ORIGINS:-}
      IFRAME_ORIGINS: ${FLOWISE_IFRAME_ORIGINS:-}
    volumes:
      - flowise:/root/.flowise
    networks: [internal]
    labels:
      traefik.enable: "true"
      traefik.docker.network: trainyard_internal
      traefik.http.routers.trainyard-flowise.rule: Host(`${FLOWISE_HOST:-flowise.${TRAINYARD_DOMAIN}}`)
      traefik.http.routers.trainyard-flowise.entrypoints: ${TRAEFIK_ENTRYPOINT:-websecure}
      traefik.http.routers.trainyard-flowise.tls: "true"
      traefik.http.routers.trainyard-flowise.tls.certresolver: ${TRAEFIK_CERT_RESOLVER:-letsencrypt}
      traefik.http.routers.trainyard-flowise.middlewares: trainyard-flowise-headers
      traefik.http.services.trainyard-flowise.loadbalancer.server.port: "3000"
      traefik.http.middlewares.trainyard-flowise-headers.headers.stsSeconds: "31536000"
      traefik.http.middlewares.trainyard-flowise-headers.headers.contentTypeNosniff: "true"
      traefik.http.middlewares.trainyard-flowise-headers.headers.referrerPolicy: strict-origin-when-cross-origin
    healthcheck:
      # Node is the one tool the image is sure to have; the first start runs migrations, hence the long grace.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/ping').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s
    deploy:
      resources:
        limits:
          memory: ${FLOWISE_MEMORY_LIMIT:-1g}

  # Nightly pg_dump to S3-compatible storage. Disabled until BACKUP_S3_BUCKET is set.
  backup:
    image: eeshugerman/postgres-backup-s3:16
    restart: unless-stopped
    profiles: [backup]
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      SCHEDULE: ${BACKUP_SCHEDULE:-@daily}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
      PASSPHRASE: ${BACKUP_PASSPHRASE:-}
      S3_REGION: ${BACKUP_S3_REGION:-auto}
      S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      S3_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
      S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      S3_PREFIX: ${BACKUP_S3_PREFIX:-trainyard/postgres}
      POSTGRES_HOST: postgres
      POSTGRES_DATABASE: trainyard
      POSTGRES_USER: trainyard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    networks: [internal]

volumes:
  pgdata:
  ollama:
  flowise:

networks:
  # Traefik in host network mode (Hostinger template) routes to container IPs on this
  # bridge. If Traefik runs on its own bridge network, deploy.sh adds
  # docker-compose.traefik-bridge.yml, which joins api and web to that network.
  internal:
    name: trainyard_internal
    driver: bridge
