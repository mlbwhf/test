<!-- Report AI — newsletter form (HubSpot Forms API, native markup, house style)
     Replace FORM_GUID_NEWSLETTER before use. Portal ID 46316757 is already correct.
     No HubSpot embed script, no iframe, no tracking cookies.
     Sets ra_source and ra_consent_basis so the separation controls work from
     the first submission (see integration-plan.md §1). -->

<style>
.tai-hsform{font-family:'Archivo',sans-serif;}
.tai-hsform .tai-hsmono{font-family:'IBM Plex Mono',monospace;}
.tai-hsform input[type=email]{width:100%;padding:11px 12px;border:1px solid #d8d8de;background:#fff;color:#111114;font-family:'Archivo',sans-serif;font-size:13px;box-sizing:border-box;}
.tai-hsform input[type=email]::placeholder{color:#9a9aa2;}
.tai-hsform input[type=email]:focus{outline:none;border-color:#2545f5;}
.tai-hsform button{width:100%;margin-top:8px;padding:11px 16px;background:#2545f5;color:#fff;border:none;border-radius:0;font-family:'Archivo',sans-serif;font-size:13px;font-weight:700;cursor:pointer;transition:background .13s ease;}
.tai-hsform button:hover{background:#111114;}
.tai-hsform button[disabled]{opacity:.5;cursor:default;}
.tai-hsform .tai-consent{display:flex;gap:8px;align-items:flex-start;margin-top:10px;font-size:11.5px;line-height:1.45;color:#6e6e76;}
.tai-hsform .tai-consent input{margin-top:2px;flex:none;}
.tai-hsform .tai-msg{font-family:'IBM Plex Mono',monospace;font-size:11.5px;margin-top:10px;display:none;}
.tai-hsform .tai-msg.ok{color:#177245;display:block;}
.tai-hsform .tai-msg.err{color:#9a6a00;display:block;}
.tai-hsform .tai-hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden;}
</style>

<div class="tai-hsform" style="background:#f5f5f7;padding:18px;">
  <div class="tai-hsmono" style="font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#2545f5;font-weight:600;margin-bottom:8px;">The weekly figure &mdash; newsletter</div>
  <p style="font-size:13px;line-height:1.5;color:#44444a;margin:0 0 12px;">One sourced figure a week, plus every new index and report. No commentary, no spam &mdash; unsubscribe in one click.</p>

  <form class="tai-hsnews" novalidate>
    <label for="tai-news-email" class="tai-hp">Email address</label>
    <input id="tai-news-email" type="email" name="email" required autocomplete="email" placeholder="you@organisation.com">

    <!-- honeypot: bots fill this, humans never see it -->
    <div class="tai-hp" aria-hidden="true"><label>Company website<input type="text" name="website" tabindex="-1" autocomplete="off"></label></div>

    <label class="tai-consent">
      <input type="checkbox" name="consent" required>
      <span>Yes, email me Report AI&rsquo;s newsletter. I understand this is Report AI&rsquo;s publication list and that I will not receive marketing from Agile Agilist. <a href="/privacy/" style="color:#2545f5;">Privacy</a>.</span>
    </label>

    <button type="submit">Subscribe &rarr;</button>
    <div class="tai-msg" role="status" aria-live="polite"></div>
  </form>
</div>

<script>
(function(){
  var PORTAL = '46316757';
  var FORM   = 'FORM_GUID_NEWSLETTER';   // <-- replace
  var ENDPOINT = 'https://api.hsforms.com/submissions/v3/integration/submit/' + PORTAL + '/' + FORM;

  document.querySelectorAll('form.tai-hsnews').forEach(function(form){
    var msg = form.querySelector('.tai-msg');
    var btn = form.querySelector('button');

    form.addEventListener('submit', function(e){
      e.preventDefault();
      msg.className = 'tai-msg';
      var email   = form.querySelector('input[name=email]').value.trim();
      var consent = form.querySelector('input[name=consent]').checked;
      var trap    = form.querySelector('input[name=website]').value;

      if (trap) { return; }                                  // silent drop for bots
      if (!email || email.indexOf('@') < 1) { msg.textContent = 'Please enter a valid email address.'; msg.className = 'tai-msg err'; return; }
      if (!consent) { msg.textContent = 'Please tick the consent box to subscribe.'; msg.className = 'tai-msg err'; return; }

      btn.disabled = true; btn.textContent = 'Subscribing…';

      fetch(ENDPOINT, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          fields: [
            { name: 'email',            value: email },
            { name: 'ra_source',        value: 'report-ai.org' },
            { name: 'ra_consent_basis', value: 'newsletter:report-ai:' + new Date().toISOString().slice(0,10) }
          ],
          context: { pageUri: location.href, pageName: document.title },
          legalConsentOptions: {
            consent: {
              consentToProcess: true,
              text: 'I agree to receive Report AI’s newsletter. This is Report AI’s publication list; it is not used for Agile Agilist marketing.',
              communications: [{
                value: true,
                subscriptionTypeId: 0,   // <-- replace with the "Report AI — The Weekly Figure" subscription type ID
                text: 'Report AI — The Weekly Figure'
              }]
            }
          }
        })
      })
      .then(function(r){ return r.ok ? r.json() : r.json().then(function(j){ throw new Error(j.message || 'submit failed'); }); })
      .then(function(){
        form.innerHTML = '<div class="tai-hsmono" style="font-size:12px;color:#177245;line-height:1.5;">Subscribed. The next figure lands in your inbox &mdash; check for a confirmation email.</div>';
      })
      .catch(function(){
        btn.disabled = false; btn.textContent = 'Subscribe →';
        msg.textContent = 'Something went wrong. Please try again, or email info@report-ai.org.';
        msg.className = 'tai-msg err';
      });
    });
  });
})();
</script>
