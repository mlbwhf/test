<!-- ============================================================
     Meridian course-hero v2 — REUSABLE COMPONENT (markup template)
     ------------------------------------------------------------
     Pair with aa-meridian-hero.css + aa-agenda.css (install once,
     site-wide). Drop this block as the hero of any course page
     (inside the page's .aa-rd wrapper, as a wp:html block). Fill the
     {{PLACEHOLDERS}}.

     WHAT CHANGED FROM v1
       RIGHT column  : the dark #aa-cohorts card is replaced by the LIGHT
                       scrollable agenda <div id="aa-agenda">. The engine's
                       buildAgenda() renders "Upcoming sessions" into it,
                       showing ALL dates with Register + Eventbrite per row.
       config carrier: #aa-cohorts is kept but HIDDEN (display:none). It
                       still carries data-title/price/strike/days/length so
                       buildAgenda()/localizePrices()/buildCohorts() read
                       config exactly as before. #aa-register and #eb-trigger
                       are kept (hidden) so nothing that depends on them breaks.
       LEFT column   : the 3-stat block is replaced by the credential lockup
                       (badge image + "The credential you earn").

     WHY .aa-mhero (not .aa-grid2): the cohort engine's buildHeroV2() only
     auto-transforms `.aa-grid2` heroes. Using `.aa-mhero` keeps THIS
     Meridian hero as-is.

     PER-COURSE PLACEHOLDERS:
       {{PARENT_URL}}   e.g. /training/adv-safe/     (breadcrumb parent)
       {{PARENT_LABEL}} e.g. Advanced SAFe
       {{ABBR}}         e.g. RTE                      (breadcrumb current chip)
       {{CHIP_MAIN}}    e.g. Advanced · RTE
       {{CHIP_TAG}}     e.g. AI-empowered             (optional 2nd chip; delete if unused)
       {{META}}         e.g. 3 days · Live-virtual · 16 PDUs · No prerequisites
       {{H1_HTML}}      e.g. SAFe®&nbsp;Release Train <em>Engineer</em>  (wrap the accent word in <em>)
       {{LEAD}}         one-sentence plain-language lede (what / format / guarantee)
       {{STRIKE}}       e.g. $2,300   (delete the <s>…</s> if no strike price)
       {{PRICE}}        e.g. $2,150
       {{RATING}}       e.g. 4.9 / 2,500+ CERTIFIED
       {{BADGE_URL}}    e.g. https://…/rte_badge_2026.png   (credential badge image)
       {{CARD_TITLE}}   e.g. SAFe RTE          (data-title on #aa-cohorts + badge lockup name)
       {{PRICE_NUM}}    e.g. 2,150             (data-price, no $)
       {{STRIKE_NUM}}   e.g. 2,300             (data-strike, no $)
       {{DAYS}}         e.g. 1,2,4             (data-days — engine cohort-day filter)
       {{LENGTH}}       e.g. 3                 (data-length — course length in days)
     ============================================================ -->
<div class="aa-mhero">
<div>
<nav aria-label="Breadcrumb" class="mono aa-rte-crumb"><a href="{{PARENT_URL}}">&larr; Back to {{PARENT_LABEL}}</a><span>{{ABBR}}</span></nav>
<div class="aa-rte-kick">
<span class="aa-rte-chip on">{{CHIP_MAIN}}</span><span class="aa-rte-chip">{{CHIP_TAG}}</span><span class="aa-rte-meta">{{META}}</span>
</div>
<h1 class="aa-h1" style="margin:16px 0 20px!important">{{H1_HTML}}</h1>
<p class="aa-lead">{{LEAD}}</p>
<div class="aa-rte-pr">
<span class="aa-rte-price"><s>{{STRIKE}}</s> {{PRICE}} <span class="mono" style="color:var(--aa-muted-2)">USD · EXAM INCLUDED</span></span>
<span class="aa-rte-div"></span>
<span class="aa-rte-rate"><span class="teal">★</span> {{RATING}}</span>
</div>
<div class="aa-cred-lockup">
<img class="aa-cred-badge" src="{{BADGE_URL}}" alt="{{CARD_TITLE}} credential badge">
<div class="aa-cred-txt">
<div class="mono aa-cred-cap">The credential you earn</div>
<div class="aa-cred-name">{{CARD_TITLE}} · verifiable digital badge</div>
</div></div></div>
<div class="aa-mhero-right">
<!-- visible light agenda — engine's buildAgenda() renders "Upcoming sessions" here -->
<div id="aa-agenda" class="aa-agenda"></div>
<!-- hidden config carrier + wiring the engine still reads/needs -->
<div id="aa-cohorts" class="aa-cohorts" data-title="{{CARD_TITLE}}" data-price="{{PRICE_NUM}}" data-strike="{{STRIKE_NUM}}" data-days="{{DAYS}}" data-length="{{LENGTH}}" style="display:none"></div>
<a href="#enroll" id="aa-register" class="btn-teal" style="display:none">Register &#10230;</a>
<button type="button" id="eb-trigger" aria-label="Register via Eventbrite" style="display:none">Register via Eventbrite</button>
</div></div>
