services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gate
      POSTGRES_PASSWORD: gate
      POSTGRES_DB: gate
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gate"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  pgdata:
