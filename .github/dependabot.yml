version: 2
updates:
  - package-ecosystem: npm
    directory: /trainyard
    schedule: { interval: weekly }
    groups:
      trainyard-minor: { update-types: [minor, patch] }
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /trainyard/infra/docker
    schedule: { interval: weekly }
