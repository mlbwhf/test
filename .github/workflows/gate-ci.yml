name: gate-ci
on:
  push:
    paths: ["gate-platform/**", ".github/workflows/gate-ci.yml"]
  pull_request:
    paths: ["gate-platform/**", ".github/workflows/gate-ci.yml"]
defaults:
  run:
    working-directory: gate-platform
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: gate, POSTGRES_PASSWORD: gate, POSTGRES_DB: gate }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gate" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://gate:gate@localhost:5432/gate
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: gate-platform/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: PAN guard (no card-number-shaped strings in source or fixtures)
        run: |
          if grep -rEn --include='*.ts' --include='*.tsx' --include='*.json' --include='*.sql' \
             --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=.next --exclude-dir=.turbo --exclude-dir=.vite \
             -e '\b(4[0-9]{12}([0-9]{3})?|5[1-5][0-9]{14}|3[47][0-9]{13})\b' . \
             | grep -v 'pan-guard-allow'; then
            echo 'Card-number-shaped string found'; exit 1; fi
