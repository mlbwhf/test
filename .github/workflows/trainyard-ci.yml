name: trainyard-ci
on:
  push:
    paths: ["trainyard/**", ".github/workflows/trainyard-ci.yml"]
  pull_request:
    paths: ["trainyard/**", ".github/workflows/trainyard-ci.yml"]
defaults:
  run:
    working-directory: trainyard
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: trainyard/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
