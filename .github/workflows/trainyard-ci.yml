name: trainyard-ci
on:
  push:
    paths: ["trainyard/**", ".github/workflows/trainyard-ci.yml"]
  pull_request:
    paths: ["trainyard/**", ".github/workflows/trainyard-ci.yml"]
defaults:
  run:
    working-directory: trainyard
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: trainyard, POSTGRES_PASSWORD: trainyard, POSTGRES_DB: trainyard }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U trainyard" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://trainyard:trainyard@localhost:5432/trainyard
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: trainyard/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      # Known vulnerabilities in what ships to production fail the build; dev tooling is reported only.
      - run: pnpm audit --prod --audit-level high
      - run: pnpm audit --audit-level critical || echo "::warning::dev dependencies have advisories; see pnpm audit"
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
  # The Jira app and the Azure DevOps extension: bundle both and keep the VSIX and the Forge
  # static folder as downloadable artifacts. Publishing stays manual (forge deploy, tfx publish).
  plugins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci && npm run build
        working-directory: trainyard/integrations/jira-forge
      - run: npm ci && npm run package
        working-directory: trainyard/integrations/azure-devops
      - uses: actions/upload-artifact@v4
        with:
          name: trainyard-plugins
          path: |
            trainyard/integrations/azure-devops/out/*.vsix
            trainyard/integrations/jira-forge/static/
            trainyard/integrations/jira-forge/manifest.yml
